<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nasdaq-Grid</title>
<style>
:root{--bg:#F3F5F6;--karte:#FFFFFF;--fg:#141B1F;--leise:#64727A;--linie:#DCE2E5;--gut:#1A7F4B;--schlecht:#B73A32;--warn:#8A5F10;--long:#0E6E8C;--short:#8C4A0E;--gutbg:#E2F2E9;--schlechtbg:#F8E5E3;--warnbg:#F6EEDC;--flachbg:#E9EDEF;
 --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;--text:system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F1417;--karte:#182025;--fg:#E4EAED;--leise:#90A0A8;--linie:#2A363C;--gut:#5CC48A;--schlecht:#EE7B72;--warn:#DDB057;--long:#5FB8D4;--short:#E0A061;--gutbg:#173326;--schlechtbg:#3A1F1D;--warnbg:#362C14;--flachbg:#222C31;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--text)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}h1{font-size:22px;margin:0;font-weight:650}
.leise{color:var(--leise)}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.zwei{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:8px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.kachel .wert{font:600 24px/1.1 var(--mono);font-variant-numeric:tabular-nums}.kachel .name{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--leise)}
.gut{color:var(--gut)}.schlecht{color:var(--schlecht)}
.pille{display:inline-block;font:12px var(--mono);padding:2px 8px;border-radius:999px;white-space:nowrap}
.pille.gut{background:var(--gutbg)}.pille.schlecht{background:var(--schlechtbg)}.pille.warn{background:var(--warnbg);color:var(--warn)}.pille.flach{background:var(--flachbg);color:var(--leise)}
.kopf{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.kopf h2{font-size:17px;margin:0;margin-right:auto}
.long h2{color:var(--long)}.short h2{color:var(--short)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}dt{color:var(--leise)}dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.balken{height:8px;background:var(--flachbg);border-radius:4px;position:relative;overflow:hidden}.balken i{position:absolute;top:0;bottom:0;border-radius:4px}
svg{width:100%;height:auto;display:block}svg text{font:11px var(--mono);fill:var(--leise)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--linie);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{font:500 12px var(--mono);color:var(--leise);text-transform:uppercase;letter-spacing:.05em}tbody tr:last-child td{border-bottom:0}
.rollen{overflow-x:auto}pre{margin:0;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;color:var(--leise)}
.tabs{display:flex;gap:6px}.tabs button{font:13px var(--text);padding:4px 10px;border:1px solid var(--linie);border-radius:6px;background:var(--karte);color:var(--fg);cursor:pointer}.tabs button[aria-pressed=true]{background:var(--fg);color:var(--karte)}
.leer{padding:28px;text-align:center;color:var(--leise)}
</style></head><body><div class="wrap">
<header><h1>Nasdaq-Grid</h1><span class="leise" id="zeile">lädt …</span></header>
<div class="raster" id="kacheln"></div>
<div class="zwei" id="bots"></div>
<div class="karte"><div class="kopf"><h2 style="color:inherit">Tagesergebnis im Verlauf</h2><span class="leise" id="kurveinfo"></span></div><div id="kurve"></div></div>
<div class="karte"><div class="kopf"><h2 style="color:inherit">Abgeschlossene Tage</h2></div><div class="rollen" id="tage"></div></div>
<div class="karte"><div class="kopf"><h2 style="color:inherit">Log</h2><div class="tabs" id="logtabs"></div></div><pre id="log"></pre></div>
</div>
<script>
var logBot="long";
function geld(v,w){if(v==null)return"–";var s=(v>0?"+":"")+v.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});return s+(w?" "+w:"")}
function zahl(v,n){return v==null?"–":Number(v).toLocaleString("de-DE",{minimumFractionDigits:n,maximumFractionDigits:n})}
function kl(v){return v>0?"gut":v<0?"schlecht":""}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function zustand(b){
  if(b.alter_s>30)return['<span class="pille schlecht">Bot antwortet nicht · '+Math.round(b.alter_s)+' s</span>'];
  var p=[b.scharf?'<span class="pille gut">scharf</span>':'<span class="pille warn">Trockenlauf</span>'];
  p.push(b.aktiv?'<span class="pille gut">läuft</span>':'<span class="pille flach">wartet auf '+esc(b.start)+' Serverzeit</span>');return p}
function botKarte(b){
  var abw=Math.abs((b.soll_lot||0)-(b.ist_lot||0))>0.001, max=Math.max(b.start_lot*2,0.01);
  var soll=Math.min(100,b.soll_lot/max*100), ist=Math.min(100,b.ist_lot/max*100);
  var schritt=b.anker?b.anker*b.schritt_prozent/100:null, hoch=b.anker?b.anker+(b.stufe+1)*schritt:null, runter=b.anker?b.anker+(b.stufe-1)*schritt:null;
  return '<div class="karte '+b.bot+'"><div class="kopf"><h2>'+(b.bot==="long"?"Long-Bot":"Short-Bot")+'</h2>'+zustand(b).join("")+'</div>'+
  '<dl><dt>Konto</dt><dd>'+esc(b.konto)+'</dd>'+
  '<dt>Tagesergebnis</dt><dd class="'+kl(b.tagesergebnis)+'">'+geld(b.tagesergebnis,b.waehrung)+'</dd>'+
  '<dt>davon offen / realisiert</dt><dd>'+geld(b.offen)+' / '+geld(b.realisiert)+'</dd>'+
  '<dt>Stufe</dt><dd>'+(b.stufe>0?"+":"")+b.stufe+' <span class="leise">('+zahl(b.stufe*b.schritt_prozent,1)+' % vom Anker)</span></dd>'+
  '<dt>Anker / Kurs</dt><dd>'+zahl(b.anker,2)+' / '+zahl(b.kurs,2)+'</dd>'+
  '<dt>nächste Stufe oben / unten</dt><dd>'+zahl(hoch,2)+' / '+zahl(runter,2)+'</dd>'+
  '<dt>Soll / Ist</dt><dd class="'+(abw?"schlecht":"")+'">'+zahl(b.soll_lot,2)+' / '+zahl(b.ist_lot,2)+' Lot</dd></dl>'+
  '<div class="balken" title="Ist-Lot gegen doppeltes Start-Lot"><i style="left:0;width:'+ist+'%;background:var(--'+b.bot+')"></i><i style="left:calc('+soll+'% - 1px);width:2px;background:var(--fg)"></i></div>'+
  '<dl><dt>Guthaben / Equity</dt><dd>'+zahl(b.guthaben,2)+' / '+zahl(b.equity,2)+' '+esc(b.waehrung)+'</dd>'+
  '<dt>Margin-Level</dt><dd class="'+(b.margin_level!=null&&b.margin_level<150?"schlecht":"")+'">'+(b.margin_level==null?"–":zahl(b.margin_level,0)+" %")+'</dd>'+
  '<dt>Volumen heute</dt><dd>'+zahl(b.volumen,2)+' Lot in '+b.deals+' Deals</dd></dl></div>'}
function kurve(bots){
  var reihen=[],alle=[];["long","short"].forEach(function(n){if(bots[n]&&bots[n].kurve&&bots[n].kurve.length){reihen.push([n,bots[n].kurve]);alle=alle.concat(bots[n].kurve)}});
  if(bots.long&&bots.short&&bots.long.kurve&&bots.short.kurve){var m={};bots.short.kurve.forEach(function(p){m[p[0]]=p[1]});var summe=bots.long.kurve.filter(function(p){return p[0] in m}).map(function(p){return[p[0],p[1]+m[p[0]]]});if(summe.length){reihen.push(["paar",summe]);alle=alle.concat(summe)}}
  if(!alle.length)return'<div class="leer">Noch keine Werte für heute.</div>';
  var x0=Math.min.apply(null,alle.map(function(p){return p[0]})),x1=Math.max.apply(null,alle.map(function(p){return p[0]}));if(x1-x0<30)x1=x0+30;
  var lo=Math.min(0,Math.min.apply(null,alle.map(function(p){return p[1]}))),hi=Math.max(0,Math.max.apply(null,alle.map(function(p){return p[1]})));if(hi-lo<1){hi+=1;lo-=1}
  var W=1000,H=260,L=64,R=12,T=10,B=26,X=function(v){return L+(v-x0)/(x1-x0)*(W-L-R)},Y=function(v){return T+(hi-v)/(hi-lo)*(H-T-B)};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Tagesergebnis">';
  [lo,0,hi].forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--linie)"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+zahl(v,0)+'</text>'});
  for(var h=Math.ceil(x0/60);h*60<=x1;h+=Math.max(1,Math.round((x1-x0)/60/8)))s+='<text x="'+X(h*60)+'" y="'+(H-8)+'" text-anchor="middle">'+("0"+h).slice(-2)+':00</text>';
  var farbe={long:"var(--long)",short:"var(--short)",paar:"var(--fg)"};
  reihen.forEach(function(r){s+='<polyline fill="none" stroke="'+farbe[r[0]]+'" stroke-width="'+(r[0]==="paar"?2.5:1.5)+'" points="'+r[1].map(function(p){return X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)}).join(" ")+'"/>'});
  return s+'</svg>'}
function tage(bots){
  var m={};["long","short"].forEach(function(n){((bots[n]||{}).verlauf||[]).forEach(function(e){(m[e.tag]=m[e.tag]||{})[n]=e})});
  var ks=Object.keys(m).sort().reverse();if(!ks.length)return'<div class="leer">Noch kein abgeschlossener Tag.</div>';
  var max=Math.max.apply(null,ks.map(function(k){return Math.abs(((m[k].long||{}).ergebnis||0)+((m[k].short||{}).ergebnis||0))}))||1;
  var s='<table><thead><tr><th>Tag</th><th>Long</th><th>Short</th><th>Paar</th><th style="width:30%"></th><th>Volumen</th></tr></thead><tbody>';
  ks.slice(0,60).forEach(function(k){var l=(m[k].long||{}).ergebnis,h=(m[k].short||{}).ergebnis,p=(l||0)+(h||0),v=((m[k].long||{}).volumen||0)+((m[k].short||{}).volumen||0),w=Math.abs(p)/max*50;
    s+='<tr><td>'+k.split("-").reverse().join(".")+'</td><td class="mono '+kl(l)+'">'+geld(l)+'</td><td class="mono '+kl(h)+'">'+geld(h)+'</td><td class="mono '+kl(p)+'"><b>'+geld(p)+'</b></td>'+
    '<td><div class="balken"><i style="'+(p>=0?"left:50%":"right:50%")+';width:'+w+'%;background:var(--'+(p>=0?"gut":"schlecht")+')"></i></div></td><td class="mono">'+zahl(v,2)+'</td></tr>'});
  return s+'</tbody></table>'}
function zeige(d){
  var b=d.bots,namen=["long","short"].filter(function(n){return b[n]});
  if(!namen.length){document.getElementById("zeile").textContent="Noch kein Bot gestartet – start-long.bat und start-short.bat ausführen.";return}
  var e=b[namen[0]],sum=function(f){return namen.reduce(function(a,n){return a+(b[n][f]||0)},0)};
  var netto=(b.long?b.long.ist_lot:0)-(b.short?b.short.ist_lot:0),paar=sum("tagesergebnis");
  document.getElementById("zeile").textContent="Serverzeit "+e.serverzeit.slice(11)+" · NAS100 "+zahl(e.kurs,2)+" · je "+zahl(e.schritt_prozent,2)+" % "+zahl(e.schritt_lot,2)+" Lot · Version "+e.version;
  var verl=0;namen.forEach(function(n){(b[n].verlauf||[]).forEach(function(x){verl+=x.ergebnis||0})});
  document.getElementById("kacheln").innerHTML=[["Paar heute",geld(paar,e.waehrung),kl(paar)],["Netto-Position",(netto>0?"+":"")+zahl(netto,2)+" Lot",""],["Volumen heute",zahl(sum("volumen"),2)+" Lot",""],["Equity beide Konten",zahl(sum("equity"),2),""],["Abgeschlossene Tage",geld(verl,e.waehrung),kl(verl)]]
    .map(function(k){return'<div class="karte kachel"><span class="name">'+k[0]+'</span><span class="wert '+k[2]+'">'+k[1]+'</span></div>'}).join("");
  document.getElementById("bots").innerHTML=namen.map(function(n){return botKarte(b[n])}).join("");
  document.getElementById("kurve").innerHTML=kurve(b);
  document.getElementById("kurveinfo").innerHTML='<span style="color:var(--long)">Long</span> · <span style="color:var(--short)">Short</span> · <b>Paar</b>';
  document.getElementById("tage").innerHTML=tage(b);
  if(!b[logBot])logBot=namen[0];
  document.getElementById("logtabs").innerHTML=namen.map(function(n){return'<button aria-pressed="'+(n===logBot)+'" data-bot="'+n+'">'+(n==="long"?"Long":"Short")+'</button>'}).join("");
  var pre=document.getElementById("log"),unten=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-8;pre.textContent=(b[logBot].log||[]).join("\n");if(unten)pre.scrollTop=pre.scrollHeight}
document.getElementById("logtabs").addEventListener("click",function(ev){var n=ev.target.getAttribute("data-bot");if(n){logBot=n;lade()}});
function lade(){fetch("/api/status").then(function(r){return r.json()}).then(zeige).catch(function(){document.getElementById("zeile").textContent="Übersicht nicht erreichbar – läuft start-dashboard.bat?"})}
lade();setInterval(lade,2000);
</script></body></html>
